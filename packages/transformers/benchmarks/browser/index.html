<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transformers.js Cache Benchmark</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fff9f1;
        --ink: #1f1a17;
        --muted: #6a5f57;
        --line: #d9cdbf;
        --accent: #a24c2f;
        --accent-2: #205c51;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(162, 76, 47, 0.12), transparent 28%),
          radial-gradient(circle at top right, rgba(32, 92, 81, 0.14), transparent 26%),
          linear-gradient(180deg, #fbf7f0 0%, var(--bg) 100%);
      }
      main {
        width: min(1100px, calc(100vw - 32px));
        margin: 32px auto 48px;
      }
      .hero {
        padding: 28px 30px;
        border: 1px solid var(--line);
        background: linear-gradient(135deg, rgba(255, 249, 241, 0.96), rgba(249, 240, 227, 0.92));
        border-radius: 22px;
        box-shadow: 0 18px 50px rgba(79, 55, 33, 0.09);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
        margin-top: 18px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 12px 36px rgba(79, 55, 33, 0.06);
      }
      .section-title {
        margin: 0 0 14px;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input, select, textarea, button {
        width: 100%;
        font: inherit;
      }
      input, select, textarea {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        background: #fffdf9;
        color: var(--ink);
      }
      textarea {
        min-height: 132px;
        resize: vertical;
      }
      .full {
        grid-column: 1 / -1;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 18px;
        cursor: pointer;
        transition: transform 140ms ease, opacity 140ms ease;
      }
      button:hover { transform: translateY(-1px); }
      button:disabled { cursor: wait; opacity: 0.6; transform: none; }
      .primary {
        background: var(--accent);
        color: white;
      }
      .secondary {
        background: rgba(32, 92, 81, 0.12);
        color: var(--accent-2);
      }
      .status {
        min-height: 22px;
        margin-top: 10px;
        color: var(--muted);
      }
      .cards {
        display: grid;
        gap: 12px;
      }
      .result-card {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.74);
      }
      .result-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .metric {
        padding: 10px;
        border-radius: 12px;
        background: rgba(162, 76, 47, 0.06);
      }
      .metric strong {
        display: block;
        font-size: 1.1rem;
      }
      pre {
        margin: 16px 0 0;
        padding: 16px;
        overflow: auto;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: #1a1715;
        color: #f8f1e7;
        font-size: 0.84rem;
        line-height: 1.45;
      }
      @media (max-width: 900px) {
        .grid, .form-grid, .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Cache Benchmark Lab</h1>
        <p>
          Browser-side comparison for <code>DynamicCache</code> versus <code>TurboQuant</code>.
          This page runs the model directly in your browser using the local build.
        </p>
      </section>

      <section class="grid">
        <div class="panel">
          <h2 class="section-title">Run Config</h2>
          <div class="form-grid">
            <div>
              <label for="modelId">Model ID</label>
              <input id="modelId" value="onnx-community/Qwen2.5-0.5B-Instruct" />
            </div>
            <div>
              <label for="device">Device</label>
              <select id="device">
                <option value="webgpu">webgpu</option>
                <option value="wasm">wasm</option>
              </select>
            </div>
            <div>
              <label for="dtype">DType</label>
              <input id="dtype" value="q4" />
            </div>
            <div>
              <label for="runs">Runs</label>
              <input id="runs" type="number" min="1" value="3" />
            </div>
            <div>
              <label for="maxNewTokens">Max New Tokens</label>
              <input id="maxNewTokens" type="number" min="1" value="64" />
            </div>
            <div>
              <label for="warmupTokens">Warmup Tokens</label>
              <input id="warmupTokens" type="number" min="1" value="8" />
            </div>
            <div>
              <label for="bKey">TurboQuant Key Bits</label>
              <input id="bKey" type="number" min="1" value="3" />
            </div>
            <div>
              <label for="bValue">TurboQuant Value Bits</label>
              <input id="bValue" type="number" min="1" value="3" />
            </div>
            <div>
              <label for="residualLength">Residual Length</label>
              <input id="residualLength" type="number" min="0" value="64" />
            </div>
            <div>
              <label for="evictionBatch">Eviction Batch</label>
              <input id="evictionBatch" type="number" min="1" value="64" />
            </div>
            <div>
              <label for="quantization">Quantization</label>
              <select id="quantization">
                <option value="sigma">sigma</option>
                <option value="minmax">minmax</option>
              </select>
            </div>
            <div>
              <label for="sigmaK">Sigma K</label>
              <input id="sigmaK" type="number" step="0.1" min="0" value="2.5" />
            </div>
            <div class="full">
              <label for="prompt">Prompt</label>
              <textarea id="prompt">Summarize how a Canton workflow assistant should review a proposed token transfer and list the main risk checks.</textarea>
            </div>
          </div>
          <div class="actions">
            <button id="runButton" class="primary">Run Benchmark</button>
            <button id="resetButton" class="secondary">Reset Log</button>
          </div>
          <div id="status" class="status"></div>
        </div>

        <div class="panel">
          <h2 class="section-title">Results</h2>
          <div id="cards" class="cards"></div>
          <pre id="rawOutput">No benchmark run yet.</pre>
        </div>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
  </html>
